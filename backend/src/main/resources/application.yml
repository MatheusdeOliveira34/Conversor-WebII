spring:
  application:
    name: fileconverter
  servlet:
    multipart:
      # RNF06: limite de upload de 10 MB
      max-file-size: 10MB
      # um pouco acima do arquivo para caber o campo targetFormat do multipart
      max-request-size: 11MB

server:
  port: 8080

app:
  cors:
    # única origem que pode chamar a API (front-end em desenvolvimento)
    allowed-origin: http://localhost:8081

spring:
  application:
    name: fileconverter
  servlet:
    multipart:
      # RNF06: limite de upload de 10 MB
      max-file-size: 10MB
      # um pouco acima do arquivo para caber o campo targetFormat do multipart
      max-request-size: 11MB
      # RNF04/RNF07: acima deste tamanho o Tomcat gravaria o upload num arquivo temporário;
      # como é maior que o limite de upload, o arquivo fica sempre em memória
      file-size-threshold: 11MB

server:
  port: 8080
  tomcat:
    # lê o resto de um upload grande demais antes de responder, para o 413 chegar ao cliente
    # em vez de a conexão ser cortada no meio do envio
    max-swallow-size: 20MB

app:
  cors:
    # única origem que pode chamar a API (front-end em desenvolvimento)
    allowed-origin: http://localhost:8081
